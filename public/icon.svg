<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle with Safe Zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Icon Graphic centered inside 80% Safe Zone -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Paper Sheet Top -->
    <path d="M64 48 C64 36, 76 24, 88 24 L232 24 C244 24, 256 36, 256 48 L256 120 L64 120 Z" fill="#f8fafc"/>
    <line x1="96" y1="56" x2="224" y2="56" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="96" y1="84" x2="184" y2="84" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

    <!-- Printer Main Body -->
    <rect x="24" y="104" width="272" height="136" rx="28" fill="url(#blueGrad)"/>

    <!-- Printer Front Panel / Slot -->
    <rect x="48" y="176" width="224" height="88" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>

    <!-- Printed Paper Coming Out -->
    <path d="M72 200 L248 200 C252 200, 256 204, 256 208 L256 280 C256 292, 244 304, 232 304 L88 304 C76 304, 64 292, 64 280 L64 208 C64 204, 68 200, 72 200 Z" fill="#ffffff"/>
    
    <!-- Printed Checkmark and Lines on Paper -->
    <circle cx="160" cy="244" r="20" fill="#10b981"/>
    <path d="M152 244 L158 250 L168 238" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <line x1="104" y1="276" x2="216" y2="276" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Status Power Indicator Light -->
    <circle cx="260" cy="136" r="8" fill="#4ade80"/>
    <!-- Diagnostic Tool Wrench Accent -->
    <circle cx="232" cy="136" r="6" fill="#f59e0b"/>
  </g>
</svg>
